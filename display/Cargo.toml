[package]
name = "ghosts-display"
version = "0.1.0"
edition = "2024"
description = "Draws ever-changing ghost kanji generated by the glyph GAN (ONNX) with GPU filters"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glow = "0.18"
noise = "0.9"
ort = "=2.0.0-rc.13"
sdl2 = "0.38"
# 録画(--features record)だけが使う。Piで動かす本番の実行ファイルには入れない。
# mp4 は FFmpeg のライブラリ(x264)で書き出す
ffmpeg-next = { version = "9", optional = true }
gif = { version = "0.14", optional = true }

[features]
# Macでの確認・共有のための、GIF・mp4への書き出し
record = ["dep:ffmpeg-next", "dep:gif"]
