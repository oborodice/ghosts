[project]
name = "ghosts-training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fonttools>=4.64.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "onnx>=1.22.0",
    "onnxruntime>=1.29.0",
    "onnxscript>=0.7.1",
    "opensimplex>=0.4.5.1",
    "pillow>=12.3.0",
    "torch==2.10.0",
]

# リアルタイム表示(scripts/run_glyph_onnx.py)だけが使うパッケージ。手元では既定で入れ、学習だけを回すpodでは入れない
# (pygame はpodの環境向けの配布版がなく、ソースからの組み立てに失敗するため。runpod_deploy_code.sh が --no-group display で同期する)
[dependency-groups]
display = [
    "av>=18.1.0",
    "pygame>=2.6.1",
    "pyopengl>=3.1.10",
]

[tool.uv]
default-groups = ["display"]
